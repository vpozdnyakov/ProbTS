# lightning.pytorch==2.5.1rc2
seed_everything: 1
trainer:
  accelerator: cpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: null
  logger: null
  callbacks: null
  fast_dev_run: false
  max_epochs: 50
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: 800
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 2
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 8
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: false
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: ./test
  enable_autolog_hparams: true
  model_registry: null
model:
  forecaster:
    class_path: probts.model.forecaster.BinFormer
    init_args:
      is_prob_forecast: true
      num_bins: 1000
      min_bin_value: -5.0
      max_bin_value: 5.0
      dropout: 0.3
      n_heads: 8
      n_layers: 3
      f_hidden_size: 32
      attn_dropout: 0.0
      scaler_type: temporal
      use_lags: false
      use_feat_idx_emb: false
      use_time_feat: false
      feat_idx_emb_dim: 1
      use_scaling: false
      autoregressive: false
      no_training: false
  num_samples: 100
  learning_rate: 0.0001
  quantiles_num: 20
  load_from_ckpt: null
  sampling_weight_scheme: none
  optimizer_config: null
  lr_scheduler_config: null
data:
  data_manager:
    class_path: probts.DataManager
    init_args:
      dataset: m4_daily
      path: ./datasets
      history_length: null
      context_length: null
      prediction_length: null
      train_ctx_len: null
      train_pred_len_list: null
      val_ctx_len: null
      val_pred_len_list: null
      test_rolling_length: 96
      split_val: true
      scaler: standard
      context_length_factor: 3
      timeenc: 1
      var_specific_norm: true
      data_path: null
      freq: null
      multivariate: true
      continuous_sample: false
      train_ratio: 0.7
      test_ratio: 0.2
      auto_search: false
  batch_size: 1
  test_batch_size: 32
  num_workers: 8
