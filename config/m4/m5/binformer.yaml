# lightning==2.3.0.dev0
seed_everything: 1
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  max_epochs: 50
  use_distributed_sampler: false
  limit_train_batches: 800
  log_every_n_steps: 2
  default_root_dir: ./results
  accumulate_grad_batches: 8
model:
  forecaster:
    class_path: probts.model.forecaster.prob_forecaster.BinFormer
    init_args:
      context_length: 72
      num_bins: 1000
      min_bin_value: -5.0
      max_bin_value: 5.0
      is_prob_forecast: true
      scaler_type: temporal
      dropout: 0.3
      f_hidden_size: 64
      n_layers: 3
      n_heads: 8
  learning_rate: 0.0001
  quantiles_num: 20
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      dataset: m5
      context_length_factor: 3
      split_val: true
      scaler: standard # identity, standard, temporal
  batch_size: 1
  test_batch_size: 32
  num_workers: 8